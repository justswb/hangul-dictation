<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글자 목록 디버그</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #f5f5f5;
        font-family: sans-serif;
      }
      #root {
        color: #111;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, 160px);
        gap: 0;
      }
      .cell {
        width: 160px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0;
      }
      .cell canvas {
        background: #fff;
        border: 1px solid #ccc;
      }
      .cell .label {
        margin-top: 6px;
        font-size: 14px;
      }
      .empty {
        font-size: 16px;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./glyphs.ts"></script>
  </body>
</html>
