services:
  dev:
    # 빌드 없이 공식 이미지 사용 (docker-compose → Podman 소켓의 이미지 빌드가 멈추는 문제 회피)
    image: docker.io/library/node:24-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      # 호스트(Windows)와 분리된 node_modules
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev

  shot:
    # 스크린샷 전용. 이미지 버전은 package.json의 playwright 버전과 같아야 한다.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ipc: host
    command: npm run shot

volumes:
  node_modules:
