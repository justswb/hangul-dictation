services:
  dev:
    # 빌드 없이 공식 이미지 사용 (docker-compose → Podman 소켓의 이미지 빌드가 멈추는 문제 회피)
    image: docker.io/library/node:24-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      # 호스트(Windows)와 분리된 node_modules
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev

  proxy:
    # 개발 프록시 (T27, docs/dev-env.md 단계 ②). dev와 같은 이미지·볼륨을 쓴다.
    image: docker.io/library/node:24-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "8787:8787"
    environment:
      # 값은 컴포즈가 호스트 환경변수에서 가져온다. 여기에 값을 적지 않는다.
      - ANTHROPIC_API_KEY
    command: node dev-proxy/server.ts

  shot:
    # 스크린샷 전용. 이미지 버전은 package.json의 playwright 버전과 같아야 한다.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ipc: host
    command: npm run shot

volumes:
  node_modules:
